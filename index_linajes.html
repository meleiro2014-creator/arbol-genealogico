<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Linajes y personajes · Libro de los Ancestros</title>
<link rel="icon" type="image/png" sizes="32x32" href="./icon-192.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=2">
<link rel="apple-touch-icon" href="./icon-192.png?v=2">
<meta name="theme-color" content="#C4653A">
<!-- Mismo tema que elija el usuario en index.html (misma clave lb_tema) -->
<script>try{var lbT=localStorage.getItem("lb_tema");if(lbT==="muelle"||lbT==="relieve"){document.documentElement.setAttribute("data-tema",lbT);}}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&family=UnifrakturMaguntia&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#FBF7F0;--card:#fff;--text:#3D2C1E;--muted:#7A6754;--accent:#C4653A;--green:#5A8A3C;--blue:#2C5F8A;--border:#E8DFD4}
*{box-sizing:border-box;margin:0;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
html{overscroll-behavior-y:contain}
body{font-family:'Lato',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior-y:contain}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 600px 400px at 20% 20%,rgba(196,101,58,.06) 0%,transparent 60%),radial-gradient(ellipse 500px 500px at 80% 80%,rgba(90,138,60,.05) 0%,transparent 60%);pointer-events:none;z-index:0}
h1,h2,h3,h4{font-family:'Cinzel',serif}

/* ===== Cabecera (idéntica a la de index) ===== */
header{background:linear-gradient(135deg,#F5EDE0,#EDE2D0);border-bottom:2px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:100;gap:8px}
.nav-hist{display:flex;gap:2px;flex-shrink:0}
.nav-hist-btn{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.nav-hist-btn:hover{border-color:var(--accent);color:var(--accent)}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon img{width:100%;height:100%;object-fit:contain;display:block}
nav{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:0 0;border:2px solid transparent;color:var(--muted);font-family:'Lato',sans-serif;font-weight:700;font-size:13px;padding:8px 12px;min-height:38px;border-radius:10px;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
nav button:hover,nav button.active{color:var(--accent);border-color:var(--accent);background:rgba(196,101,58,.06)}

/* ===== Contenido ===== */
main{position:relative;z-index:1;max-width:100%;margin:0 auto;padding:14px}
.view{display:none}
.view.active{display:block;animation:viewSlideFromRight .24s ease}
@keyframes viewSlideFromRight{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.view.active{animation:none}}
.hero{position:relative;overflow:hidden;text-align:center;padding:34px 16px 22px;background:radial-gradient(ellipse 420px 260px at 12% 8%,rgba(150,110,60,.10),transparent 60%),radial-gradient(ellipse 380px 300px at 88% 92%,rgba(150,110,60,.09),transparent 60%),radial-gradient(ellipse 700px 500px at 50% 50%,transparent 55%,rgba(120,85,40,.10) 100%),linear-gradient(180deg,#F8F1E0,#F3E9D2);border:1px solid #E3D5B8;border-radius:18px;margin-bottom:18px;box-shadow:inset 0 0 60px rgba(120,85,40,.08),0 2px 10px rgba(120,85,40,.08)}
.hero h1{font-size:clamp(24px,5vw,42px);margin-bottom:5px}
.hero h1::after{content:'';display:block;width:160px;height:9px;margin:9px auto 0;background:radial-gradient(circle at 50% 4px,var(--accent) 0 2.4px,transparent 2.9px),linear-gradient(90deg,transparent,var(--accent) 30%,var(--accent) 70%,transparent);background-size:100% 9px,100% 1.5px;background-position:center top,center 4px;background-repeat:no-repeat;opacity:.7}
.hero p{color:var(--muted);font-size:14px}
.contenedor{max-width:1000px;margin:0 auto}
.lam-wrap{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:22px 18px;text-align:center}
.lam-wrap .ico{width:54px;height:54px;border-radius:14px;border:2px solid var(--border);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px}
.lam-wrap h2{font-size:20px;color:var(--accent);margin-bottom:6px}
.lam-msg{color:var(--muted);font-size:13px;line-height:1.5;margin:6px auto 0;max-width:520px}
@media(max-width:640px){
header{padding:0 10px}
.mh{display:none}
nav button{padding:8px 14px}
.hero{padding:22px 12px 16px}
}

/* ===== TEMA «MUELLE» (el mismo que index) ===== */
html[data-tema="muelle"]{color-scheme:dark;--bg:#0C2B3B;--card:#14465D;--text:#E4F2F5;--muted:#8FB8C7;--accent:#F2A71B;--green:#6FC2A5;--blue:#86CBE3;--border:#2C6A85}
html[data-tema="muelle"] body::before{background:radial-gradient(ellipse 600px 400px at 20% 15%,rgba(242,167,27,.10) 0%,transparent 60%),radial-gradient(ellipse 500px 500px at 80% 85%,rgba(134,203,227,.10) 0%,transparent 60%)}
html[data-tema="muelle"] header{background:linear-gradient(135deg,#0F3549,#0A2634);border-bottom-color:var(--border)}
html[data-tema="muelle"] nav button:hover,html[data-tema="muelle"] nav button.active{background:rgba(242,167,27,.12)}
html[data-tema="muelle"] .hero{color:var(--text);background:linear-gradient(180deg,rgba(242,167,27,.06),transparent);border-color:var(--border);box-shadow:none}

/* ===== TEMA «RELIEVE» (el mismo que index) ===== */
html[data-tema="relieve"]{color-scheme:dark;--bg:#211B17;--card:#3A2B22;--text:#F1E6D2;--muted:#C2AB8C;--accent:#D6A957;--green:#A3B470;--blue:#A4B3BB;--border:#5E4636}
html[data-tema="relieve"] body{background-color:var(--bg);background-image:linear-gradient(180deg,#2A211C 0%,#1C1714 100%)}
html[data-tema="relieve"] body::before{background:radial-gradient(ellipse 620px 420px at 18% 12%,rgba(176,98,52,.16) 0%,transparent 62%),radial-gradient(ellipse 520px 520px at 82% 88%,rgba(214,169,87,.10) 0%,transparent 60%),repeating-linear-gradient(91deg,rgba(255,255,255,.012) 0 1px,transparent 1px 6px,rgba(0,0,0,.05) 6px 7px,transparent 7px 13px)}
html[data-tema="relieve"] ::selection{background:rgba(214,169,87,.4);color:#FFF6E4}
html[data-tema="relieve"] header{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.20)),repeating-linear-gradient(92deg,rgba(0,0,0,.12) 0 1px,transparent 1px 7px,rgba(255,255,255,.03) 7px 8px,transparent 8px 15px),linear-gradient(135deg,#5C3B27,#3A2519);border-bottom:1px solid var(--accent);box-shadow:0 3px 0 -1px #1A1410,0 4px 0 -1px rgba(214,169,87,.55),0 10px 24px -12px rgba(0,0,0,.7)}
html[data-tema="relieve"] nav button:hover,html[data-tema="relieve"] nav button.active{background:rgba(214,169,87,.13)}
html[data-tema="relieve"] .hero{color:var(--text);background:radial-gradient(ellipse 460px 280px at 14% 6%,rgba(176,98,52,.22),transparent 62%),radial-gradient(ellipse 420px 320px at 88% 94%,rgba(214,169,87,.12),transparent 60%),repeating-linear-gradient(178deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px),linear-gradient(180deg,#46342A,#2C221C);border:1px solid rgba(214,169,87,.55);outline:1px solid rgba(214,169,87,.35);outline-offset:-8px;box-shadow:inset 0 0 70px rgba(0,0,0,.45),0 14px 30px -18px rgba(0,0,0,.8)}
html[data-tema="relieve"] .hero h1{color:#E8C886;text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 18px rgba(214,169,87,.18)}
html[data-tema="relieve"] .hero h1::after{opacity:.9}
html[data-tema="relieve"] .nav-hist-btn{background:linear-gradient(180deg,#45332A,#33261F);border-color:#6A4F3D;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 6px rgba(0,0,0,.35)}
html[data-tema="relieve"] .nav-hist-btn:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<header>
  <div class="nav-hist">
    <button type="button" class="nav-hist-btn" id="volver" title="Volver al Libro de los Ancestros" aria-label="Volver al Libro de los Ancestros"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></button>
  </div>
  <div class="logo"><span class="logo-icon"><img src="./icon-192.png?v=2" alt="" width="32" height="32" onerror="this.style.display='none'"></span></div>
  <nav id="mn" role="tablist" aria-label="Linajes y personajes">
    <button class="active" role="tab" aria-selected="true" data-view="reyes"><i class="fa-solid fa-crown" aria-hidden="true"></i> <span class="mh">Reyes</span></button>
    <button role="tab" aria-selected="false" data-view="personajes"><i class="fa-solid fa-user-group" aria-hidden="true"></i> <span class="mh">Personajes</span></button>
  </nav>
</header>

<main>
  <div class="contenedor">
    <div class="hero">
      <h1>Linajes y personajes</h1>
      <p>Reyes y figuras de la historia ligadas a tu árbol</p>
    </div>

    <div class="view active" id="v-reyes" role="tabpanel">
      <div class="lam-wrap">
        <div class="ico"><i class="fa-solid fa-crown" aria-hidden="true"></i></div>
        <h2>Reyes</h2>
        <p class="lam-msg">Aquí irán los reyes y las casas reales de tu base de datos, con sus escudos y sus fotos.</p>
      </div>
    </div>

    <div class="view" id="v-personajes" role="tabpanel">
      <div class="lam-wrap">
        <div class="ico"><i class="fa-solid fa-user-group" aria-hidden="true"></i></div>
        <h2>Personajes</h2>
        <p class="lam-msg">Aquí irán los personajes relevantes: nobles y otras figuras de la historia ligadas a tus linajes.</p>
      </div>
    </div>
  </div>
</main>

<script>
(function(){
  var botones=document.querySelectorAll('#mn button');
  var ids=['reyes','personajes'];
  function ir(id){
    botones.forEach(function(b){
      var on=b.dataset.view===id;
      b.classList.toggle('active',on);
      b.setAttribute('aria-selected',on?'true':'false');
    });
    ids.forEach(function(v){
      var el=document.getElementById('v-'+v);
      el.classList.remove('active');
      if(v===id){void el.offsetWidth;el.classList.add('active');}
    });
    try{history.replaceState(null,'','#'+id);}catch(e){}
  }
  botones.forEach(function(b){b.addEventListener('click',function(){ir(b.dataset.view);});});
  var h=(location.hash||'').slice(1);
  if(ids.indexOf(h)>=0)ir(h);

  /* «Volver»: si se abrió desde la app (pestaña nueva), cierra esta pestaña y enfoca la app. */
  var desdeApp=false;
  try{desdeApp=!!(window.opener&&!window.opener.closed);}catch(e){}
  document.getElementById('volver').addEventListener('click',function(){
    if(desdeApp){
      try{window.opener.focus();}catch(e){}
      window.close();
      setTimeout(function(){location.href='index.html';},300);
    }else{
      location.href='index.html';
    }
  });
})();
</script>
</body>
</html>
